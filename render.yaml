services:
  - type: web
    name: vidforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STORAGE_DIR
        value: /tmp/vidforge
      - key: MOCK_AI
        value: true
      - key: WEB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_MAX
        value: 30
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
